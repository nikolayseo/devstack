server {
    listen 80;

    # Swagger UI и JSON-спецификация должны идти в backend без лишних rewrites
    location = /docs {
        proxy_pass http://backend:3000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /docs/ {
        proxy_pass http://backend:3000/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /docs-json {
        proxy_pass http://backend:3000/docs-json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API — проксируем на backend-контейнер по имени сервиса.
    # Трейлинг-слэш срезает префикс /api: /api/products -> /products
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: любой неизвестный путь отдаём index.html (React Router)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
