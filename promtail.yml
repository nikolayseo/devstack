# Promtail — агент сбора логов для Loki
# Читает логи Docker-контейнеров через Docker socket

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=devstack"]
    relabel_configs:
      # Используем имя контейнера как метку — чтобы в Grafana можно было фильтровать
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "logstream"
      # Имя compose-сервиса
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
